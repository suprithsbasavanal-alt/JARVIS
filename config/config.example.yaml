# JARVIS Configuration (Safe Development Example)
# Environment: Phase 0 Mock Sandbox

system:
  environment: "development"
  debug: true
  timezone: "Asia/Kolkata"
  user_display_name: "Suprith"
  formal_salutation: "Sir"

security:
  default_permission_level: "NORMAL" # Options: LOCKED, NORMAL, SENSITIVE
  require_confirmation_for_sensitive: true
  enable_prompt_guard: true
  enable_pii_sanitization: true
  audit_log_path: "logs/audit.log"
  session_timeout_minutes: 60
  max_failed_auth_attempts: 3

models:
  default_provider: "mock" # Options: mock, local, cloud
  fast_tier:
    provider: "mock"
    model_name: "mock-fast-v1"
    temperature: 0.2
    max_tokens: 1024
  reasoning_tier:
    provider: "mock"
    model_name: "mock-reasoning-v1"
    temperature: 0.1
    max_tokens: 4096
  local_private_tier:
    provider: "mock"
    model_name: "mock-local-v1"
    endpoint: "http://127.0.0.1:11434"
    temperature: 0.1

memory:
  storage_type: "sqlite_encrypted" # In Phase 0: mock in-memory / safe file
  db_path: "data/memory.db"
  vector_index_path: "data/vectors"
  enable_encryption: true
  retention_days: 90
  max_working_memory_items: 20

sandbox:
  enabled: true
  enforce_strict_isolation: true
  virtual_root: "sandbox/fixtures/mock_files"
  allow_network: false

voice:
  enabled: false
  wake_phrase: "Hey Jarvis"
  stt_engine: "mock"
  tts_engine: "mock"
